[package]
name = "tomori-bake"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bake = ">=0.20.2"
base-project = ">=0.1.12"
# 0.3.11 writes the kept `## Unreleased` breaking changes and generated ones as one list.
bake-releases = ">=0.3.11"

[dev-dependencies]
# Reads `cargo metadata`, for the dependency rule between the core, environments and apps.
serde_json = "1"
tempfile = "3"
