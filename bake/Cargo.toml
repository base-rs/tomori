[package]
name = "tomori-bake"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bake = ">=0.20.2"
base-project = ">=0.1.13"
# 0.3.12 counts a `Release:` trailer in `releases:check` only on a commit that writes exactly the generated notes.
bake-releases = ">=0.3.12"

[dev-dependencies]
# Reads `cargo metadata`, for the dependency rule between the core, environments and apps.
serde_json = "1"
tempfile = "3"
