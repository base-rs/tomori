[package]
name = "tomori-speech"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Streaming speech recognition, speakable text selection and synthesis for the Tomori server"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "speech", "asr", "tts", "sherpa-onnx"]
categories = ["multimedia::audio", "accessibility"]

[features]
# The model finder, for the tests of other crates that run the models; see src/test_models.rs.
test-models = []
# Link sherpa-onnx and ONNX Runtime as shared libraries from `SHERPA_ONNX_LIB_DIR`, such as the CUDA build, instead of the static CPU libraries downloaded by default.
shared = ["sherpa-onnx/shared"]

[dependencies]
base-markdown = "0.1.4"
log = "0.4"
# English phonemes for Kokoro, in Rust, without espeak-ng; pinned, as it is young, so that pronunciation changes only when it is upgraded on purpose.
loqui-g2p = "=0.4.0"
regex = "1"
tomori-protocol = { version = "0.2.0", path = "../protocol" }
# The pronunciations in assets/pronunciations.toml, and a server's own; already in the lock file for proc-macro-crate, so it adds nothing.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
# Pinned to the version whose libraries scripts/fetch-sherpa-onnx.sh verifies. 2.x links no espeak-ng; see readme.md.
sherpa-onnx = { version = "=2.0.1", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
