[package]
name = "tomori-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bonjour (DNS-SD over multicast DNS) advertising and browsing for Tomori servers"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "bonjour", "mdns", "dns-sd"]
categories = ["network-programming"]

[dependencies]
mdns-sd = { version = "0.21", default-features = false, features = ["logging"] }
tomori-protocol = { version = "0.1.0", path = "../protocol" }

[dev-dependencies]
# The channel a browser receives from its querier, so that tests can send it events.
flume = { version = "0.12", default-features = false }

[[package.metadata.bake.test.coverage.exclude]]
path = "src/daemon.rs"
reason = "Starts the multicast DNS responder and querier, whose failures come only from the system, such as running out of descriptors."
