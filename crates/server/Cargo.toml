[package]
name = "tomori-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Tomori server: spaces, agent sessions and live audio over one duplex connection per client"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "agents", "xr", "server", "speech"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "tomori-server"
path = "src/main.rs"

[[test]]
name = "connection"
required-features = ["fake"]

[[test]]
name = "counts"
required-features = ["fake"]

[[test]]
name = "limits"
required-features = ["fake"]

[[test]]
name = "spaces"
required-features = ["fake"]

[[test]]
name = "security"
required-features = ["fake"]

[[test]]
name = "pairing"
required-features = ["fake"]

[[test]]
name = "knocking"
required-features = ["fake"]

[[test]]
name = "persistence"
required-features = ["fake"]

[[test]]
name = "instructions"
required-features = ["fake"]

[[test]]
name = "workspaces"
required-features = ["fake"]

[[test]]
name = "speech"
required-features = ["fake", "speech"]

[features]
default = ["fake", "opencode", "speech"]
# A scripted in-memory backend for tests and for manual testing without an agent.
fake = []
# OpenCode, driven over the HTTP and SSE APIs of a running `opencode serve` process.
opencode = ["dep:tomori-backend-opencode"]
# Speech recognition and synthesis with the speech crate's in-process sherpa-onnx engines.
speech = ["dep:tomori-speech"]
# Link the speech engines from the shared sherpa-onnx libraries in `SHERPA_ONNX_LIB_DIR`, such as its CUDA build, for `--speech-provider cuda`; see crates/speech/readme.md.
speech-shared = ["speech", "tomori-speech/shared"]

[dependencies]
async-channel = "2"
tomori-backend = { version = "0.1.0", path = "../backend" }
tomori-backend-opencode = { version = "0.1.0", path = "../backend-opencode", optional = true }
base-http = "0.2.0"
base-endpoint = { version = "0.1.0", features = ["rustls"] }
base-http-server = { version = "0.2.0", features = ["rustls"] }
base-scheduler = "0.3.0"
base-scheduler-native = "0.3.1"
tomori-discovery = { version = "0.1.0", path = "../discovery" }
env_logger = "0.11"
event-listener = "5"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
gethostname = "1.1"
log = "0.4"
tomori-protocol = { version = "0.1.0", path = "../protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tomori-security = { version = "0.1.0", path = "../security", features = ["issue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tomori-speech = { version = "0.1.0", path = "../speech", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tomori-security = { version = "0.1.0", path = "../security", features = ["issue"] }
tomori-client = { version = "0.1.0", path = "../client" }
