[package]
name = "tomori-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Tomori server library: spaces, agent sessions and live audio over one duplex connection per client, and the builder a server registers its backends and environments on"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "agents", "xr", "server", "speech"]
categories = ["network-programming"]

[[test]]
name = "connection"
required-features = ["fake"]

[[test]]
name = "counts"
required-features = ["fake"]

[[test]]
name = "limits"
required-features = ["fake"]

[[test]]
name = "spaces"
required-features = ["fake"]

[[test]]
name = "security"
required-features = ["fake"]

[[test]]
name = "pairing"
required-features = ["fake"]

[[test]]
name = "pairing_output"
required-features = ["fake"]

[[test]]
name = "knocking"
required-features = ["fake"]

[[test]]
name = "persistence"
required-features = ["fake"]

[[test]]
name = "instructions"
required-features = ["fake"]

[[test]]
name = "mcp"
required-features = ["fake"]

[[test]]
name = "workspaces"
required-features = ["fake"]

[[test]]
name = "server_sides"
required-features = ["fake"]

[[test]]
name = "environment_versions"
required-features = ["fake"]

[[test]]
name = "speech"
required-features = ["fake", "speech"]

[features]
default = ["fake", "highlight", "opencode", "speech"]
# A scripted in-memory backend for tests and for manual testing without an agent.
fake = []
# OpenCode, driven over the HTTP and SSE APIs of a running `opencode serve` process.
opencode = ["dep:tomori-backend-opencode"]
# Syntax highlighting of the agent's code panels, with tree-sitter and syntect, which only a server builds: without it, code panels are plain. Clients' tests build the server without it.
highlight = ["dep:tomori-highlight"]
# Speech recognition and synthesis with the speech crate's in-process sherpa-onnx engines.
speech = ["dep:tomori-speech"]
# Link the speech engines from the shared sherpa-onnx libraries in `SHERPA_ONNX_LIB_DIR`, such as its CUDA build, for `--speech-provider cuda`; see crates/speech/readme.md.
speech-shared = ["speech", "tomori-speech/shared"]

[dependencies]
async-channel = "2"
tomori-backend = { version = "0.2.0", path = "../backend" }
tomori-environment = { version = "0.2.0", path = "../environment" }
tomori-backend-opencode = { version = "0.2.0", path = "../backend-opencode", optional = true }
base-http = "0.2.0"
base-http-client = { version = "0.2.0", features = ["rustls"] }
base-endpoint = { version = "0.1.0", features = ["rustls"] }
base-http-server = { version = "0.2.0", features = ["rustls"] }
base-scheduler = "0.3.0"
base-scheduler-native = "0.3.1"
tomori-discovery = { version = "0.2.0", path = "../discovery" }
tomori-highlight = { version = "0.2.0", path = "../highlight", optional = true }
env_logger = "0.11"
event-listener = "5"
futures-lite = "2"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
gethostname = "1.1"
# Decoding the files the agent shows as image panels, with pure Rust decoders, and encoding them again for clients.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
log = "0.4"
tomori-protocol = { version = "0.2.0", path = "../protocol" }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tomori-security = { version = "0.2.0", path = "../security", features = ["issue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tomori-speech = { version = "0.2.0", path = "../speech", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The model finder for the tests that load the speech engines.
tomori-speech = { version = "0.2.0", path = "../speech", features = ["test-models"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tomori-security = { version = "0.2.0", path = "../security", features = ["issue"] }
tomori-client = { version = "0.2.0", path = "../client" }

[[package.metadata.bake.test.coverage.exclude]]
path = "src/exit.rs"
reason = "Ends the process at once with _exit, after which it writes no coverage."
