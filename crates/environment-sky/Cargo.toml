[package]
name = "tomori-environment-sky"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tomori's moonlit sky environment renderer"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

[dev-dependencies]
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
# The device for offscreen rendering tests and WGSL validation. `tomori-render` depends on this crate, which Cargo allows for a development dependency; it has no version, as this crate is not published.
tomori-render = { path = "../render", features = ["test-gpu"] }

[build-dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
