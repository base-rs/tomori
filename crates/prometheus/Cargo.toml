[package]
name = "tomori-prometheus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A generic Prometheus data source for Tomori environments' server sides: a blocking client for instant and range queries, with a renewable bearer token, bounds, a bounded cache, typed results and label filtering"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "prometheus", "promql", "metrics", "monitoring"]
categories = ["api-bindings", "network-programming"]

[dependencies]
# The jobs a client's thread takes, which its callers queue without blocking.
async-channel = "2"
base-http = "0.4.0"
base-http-client = { version = "0.4.0", features = ["rustls"] }
base-scheduler = "0.5.0"
base-scheduler-native = "0.5.0"
form_urlencoded = "1"
futures-lite = "2"
# The requests and connection drivers a client's thread runs at once.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = "1"
# The roots an endpoint's certificate is checked against.
webpki-roots = "1"

[dev-dependencies]
# A certificate of the tests' own, for an HTTPS fake on a loopback port.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
