[package]
name = "tomori-backend-opencode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The OpenCode backend for the Tomori server: sessions on a running `opencode serve` process, driven over its HTTP and SSE APIs"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "opencode", "agents", "backend"]
categories = ["development-tools", "api-bindings"]

[dependencies]
async-channel = "2"
tomori-backend = { version = "0.2.0", path = "../backend" }
base-http = "0.4.0"
base-http-client = "0.4.0"
base-scheduler = "0.5.0"
base-scheduler-native = "0.5.0"
futures-lite = "2"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std", "async-await", "async-await-macro"] }
serde = "1"
serde_json = "1"
