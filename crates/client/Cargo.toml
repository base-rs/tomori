[package]
name = "tomori-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Connection, reconnection and playback for Tomori clients"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "client", "agents", "xr", "audio"]
categories = ["network-programming", "multimedia::audio"]

[dependencies]
base-http = "0.4.0"
base-http-client = { version = "0.4.0", features = ["rustls"] }
base-scheduler = "0.5.0"
base-scheduler-native = "0.5.0"
tomori-discovery = { version = "0.2.0", path = "../discovery" }
futures-lite = "2.6.1"
# Decoding an environment's ambience, Ogg Vorbis, a packet at a time on its own thread: pure Rust, without unsafe code, under MIT or Apache-2.0. See design/spatial-audio.md.
lewton = "0.10.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checking that each image panel's image is the one its panel names.
sha2 = "0.10"
tomori-protocol = { version = "0.2.0", path = "../protocol" }
tomori-security = { version = "0.2.0", path = "../security" }

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
base-endpoint = "0.3.0"
base-http-server = "0.4.0"
# The certificates and tokens of the test server below.
tomori-security = { version = "0.2.0", path = "../security", features = ["issue"] }
# A server on a loopback port, with a scripted backend, for the connection's tests that take part in its spaces. `tomori-server`'s own tests depend on this crate, which Cargo allows for a development dependency. It has no version, so that packaging leaves it out: only the tests use it.
tomori-server = { path = "../server", default-features = false, features = ["fake"] }
