[package]
name = "tomori-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The platform-neutral Tomori client: the frame step, the conversation and the panels' layout, free of rendering, windowing and device code"
repository.workspace = true
license.workspace = true
# Published once the headset's builder has proved its interfaces; see design/crates.md.
publish = false

[features]
# `test_support`: a microphone and a speaker without hardware, and a TLS test server with scripted agent sessions, with `scene::fixtures` and `Conversation::take_actions`, shared with the other client crates' tests. Enabled only by tests; every other test hook is `cfg(test)`.
testing = ["dep:tomori-server", "dep:tomori-backend"]

[dependencies]
base-markdown = "0.1.4"
bytemuck = { version = "1", features = ["derive"] }
font8x8 = "0.3"
glam = "0.30"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tomori-client = { version = "0.1.0", path = "../client" }
tomori-discovery = { version = "0.1.0", path = "../discovery" }
tomori-protocol = { version = "0.1.0", path = "../protocol" }
tomori-security = { version = "0.1.0", path = "../security" }
tomori-backend = { version = "0.1.0", path = "../backend", optional = true }
tomori-server = { version = "0.1.0", path = "../server", default-features = false, features = ["fake"], optional = true }

[dev-dependencies]
# A server on a loopback port, with a scripted backend, for the tests that take part in its spaces, and the backend's events to script it with.
tomori-backend = { version = "0.1.0", path = "../backend" }
tomori-server = { version = "0.1.0", path = "../server", default-features = false, features = ["fake"] }
