[package]
name = "tomori-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tomori's authentication, tokens, certificates and pinning, shared by the server and clients"
repository.workspace = true
license.workspace = true
readme = "readme.md"
keywords = ["tomori", "authentication", "pairing", "tls"]
categories = ["authentication", "cryptography"]

[features]
# Issue and store tokens, and generate the server's certificate: the server's side.
issue = ["dep:rcgen", "dep:serde", "dep:serde_json"]

[dependencies]
getrandom = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
sha2 = "0.10"
unicode-normalization = "0.1.24"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
