[package]
name = "tomori-environment-farmyard-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tomori's farmyard environment, its client half: the scenery Tomori's clients draw and its registration with a client's sceneries"
repository.workspace = true
# The code is MIT, as is the rest of Tomori; the tūī, bellbird and kererū in `assets/sounds`, by the Department of Conservation (NZ), and the ruru, by eklemp, are under the Creative Commons Attribution 4.0 International licence (CC BY 4.0), and its other sounds are CC0 1.0; see assets/sounds/LICENSE.md. Both apply.
license = "MIT AND CC-BY-4.0"
readme = "readme.md"
keywords = ["tomori", "environment", "xr", "farmyard", "wgpu"]
categories = ["rendering", "game-development"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
log = "0.4"
serde_json = "1"
tomori-assets = { version = "0.2.0", path = "../assets" }
tomori-environment-farmyard = { version = "0.2.0", path = "../environment-farmyard" }
# The beach's stones as the server side shares them, mirrored without the simulation, which a client never runs.
tomori-physics = { version = "0.2.0", path = "../physics", default-features = false }
tomori-protocol = { version = "0.2.0", path = "../protocol" }
tomori-render = { version = "0.2.0", path = "../render" }
tomori-scene = { version = "0.2.0", path = "../scene" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

[build-dependencies]
# The digests of the sounds the build finds in assets/sounds, by which the program's library checks them.
sha2 = "0.10"

[dev-dependencies]
# The farmyard's server side, whose state its client side's tests read.
tomori-environment-farmyard = { path = "../environment-farmyard", features = ["side"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
# The voices' law of distance, by which the ambience's levels are checked where participants stand.
tomori-client = { version = "0.2.0", path = "../client" }
# The room above the ground that an obstacle must reach into to take ground, by which the walkability tests tell what
# stands on the ground from what hangs high over it, such as a tree fern's crown; and where a participant is, as the
# server side's stones are told it, which the stones' tests play against.
tomori-environment = { version = "0.2.0", path = "../environment" }
# The device for offscreen rendering tests and WGSL validation. It has no version, so that packaging leaves it out: only the tests use it.
tomori-render = { path = "../render", features = ["test-gpu"] }
