[workspace]
members = ["crates/environment-sky", "crates/protocol", "crates/security", "crates/backend", "crates/backend-opencode", "crates/client", "crates/client-quest", "crates/scene", "crates/discovery", "crates/server", "crates/speech", "examples/server", "bake"]
resolver = "3"

[workspace.package]
# One version for every crate: they are released together, with one `releases.md` and one tag. `cargo bake cargo:release:*` updates it and the versions of the crates' dependencies on each other.
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ioquatix/tomori"
# The oldest Rust that builds the workspace with its locked dependencies: wgpu-hal depends on ordered-float 5.5, which needs 1.90. The source itself needs 1.88, for let chains and `slice::as_chunks`. CI builds and tests with this version.
rust-version = "1.90"

[workspace.metadata.bake.release]
reviewers = ["ioquatix"]

[profile.release]
lto = "thin"
strip = "debuginfo"

# Keep sideload/debug builds fast enough to run the simulation at headset rates.
[profile.dev]
opt-level = 1
