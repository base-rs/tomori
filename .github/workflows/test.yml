name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Formatting, Clippy and the workspace tests on current stable Rust, under the Base 100% source-region coverage gate, and the tests on the minimum supported version, which is the workspace's `rust-version` in Cargo.toml. The main branch ruleset requires test-result below and check from publish.yml. See the Tests section of readme.md.
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, minimum]
    steps:
      - uses: actions/checkout@v7
      - name: Read the minimum supported Rust version
        id: version
        if: matrix.rust == 'minimum'
        run: |
          rust=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if [[ ! "$rust" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error file=Cargo.toml::Expected rust-version = \"X.Y\" in [workspace.package], found '$rust'."
            exit 1
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.version.outputs.rust || 'stable' }}
          # Formatting and Clippy run on stable only, as their lints change between versions, and so does coverage.
          components: ${{ matrix.rust == 'stable' && 'clippy, llvm-tools-preview, rustfmt' || '' }}
          # Invalidate caches containing the retired socketry-cargo-bake launcher.
          cache-shared-key: coverage-bake-launcher-v2
      # Mesa's software Vulkan driver, lavapipe, and the Vulkan loader, so that the offscreen rendering tests run without a GPU.
      - name: Install the ALSA development files for the desktop client, and lavapipe
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev libvulkan1 mesa-vulkan-drivers
      - uses: actions/cache@v6
        with:
          path: .tools/sherpa-onnx
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-sherpa-onnx.sh') }}
      - name: Fetch the sherpa-onnx libraries
        run: bash scripts/fetch-sherpa-onnx.sh
      # The speech models that the speech tests run, kept between runs. The key changes with the scripts, which pin each model's digests, and the scripts check every model against them, cached or not, fetching again any that does not match.
      - uses: actions/cache@v6
        with:
          path: |
            .tools/asr
            .tools/tts/kokoro-multi-lang-v1_0
          key: speech-models-${{ hashFiles('scripts/fetch-asr-model.sh', 'scripts/fetch-tts-model.sh') }}
      - name: Fetch the speech models
        # Whisper tiny.en rather than the server's default, small.en, which is ten times larger.
        run: |
          bash scripts/fetch-asr-model.sh whisper tiny.en
          bash scripts/fetch-tts-model.sh
      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        if: matrix.rust == 'minimum'
        env:
          # Fail the rendering tests, rather than skipping them, if no Vulkan adapter is found.
          TOMORI_REQUIRE_GPU: 1
          # Fail the speech model tests, rather than skipping them, if a model is missing.
          TOMORI_REQUIRE_MODELS: 1
        run: cargo test --workspace --locked
      - name: Install Bake launcher
        if: matrix.rust == 'stable'
        run: cargo install bake --locked
      - name: Install coverage tool
        if: matrix.rust == 'stable'
        run: cargo install cargo-llvm-cov --locked
      # The coverage task runs the tests itself, after the project's test:before task, which fetches the sherpa-onnx libraries, unchanged since the step above.
      - name: Run tests and require complete source-region coverage
        if: matrix.rust == 'stable'
        shell: bash
        env:
          TOMORI_REQUIRE_GPU: 1
          TOMORI_REQUIRE_MODELS: 1
        run: cargo bake --locked test:coverage --all-targets true 2>&1 | tee coverage.log
      # Bake reports a coverage failure as one line holding every uncovered region, often megabytes long, which the Actions log viewer doesn't show. This step extracts the counts, computes the percentage, and writes it to both the log and the job summary.
      - name: Summarize coverage
        if: always() && matrix.rust == 'stable'
        shell: bash
        run: |
          result=$(grep -o -E 'region coverage is [0-9]+/[0-9]+ measured source regions[^;]*; [0-9]+ source regions remain uncovered|Region coverage passed: [0-9]+/[0-9]+ measured source regions covered[^)]*\)' coverage.log | head -n 1 || true)
          if [ -z "$result" ]; then
            echo "No coverage result found in coverage.log." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          counts=$(grep -o -E '[0-9]+/[0-9]+' <<< "$result" | head -n 1)
          percentage=$(awk -F / '{ if ($2 > 0) printf "%.2f", 100 * $1 / $2; else print "100.00" }' <<< "$counts")
          echo "Source-region coverage: ${percentage}% (${result})." | tee -a "$GITHUB_STEP_SUMMARY"

  # The client core and the headset application for the Quest, as scripts/android.sh builds them.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The NDK, platform and build tools named in readme.md.
      ANDROID_NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-linux-android
      - name: Install the Android NDK, platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" "platforms;android-32" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build the headset application
        # Fetches the Khronos OpenXR loader, checked against its published SHA-256, and packages it.
        run: bash scripts/android.sh build
      - name: Build the client core on its own
        # Checks the core with only its own features, as design/clients.md requires, rather than those the headset unifies with it. After scripts/android.sh, which creates the directory cargo-apk needs for SHERPA_ONNX_ARCHIVE_DIR.
        run: cargo apk -- build --package tomori-client --target aarch64-linux-android --locked
      - name: Build the scene on its own
        # The platform-neutral client, with only its own features, likewise.
        run: cargo apk -- build --package tomori-scene --target aarch64-linux-android --locked
      - name: Build the renderer on its own
        # The renderers, with only their own features, likewise, so that a host-only dependency in them is caught.
        run: cargo apk -- build --package tomori-render --target aarch64-linux-android --locked
      - uses: actions/upload-artifact@v7
        with:
          name: tomori-apk
          path: target/debug/apk/tomori.apk
          if-no-files-found: error
          retention-days: 7

  test-result:
    if: always()
    needs: [test, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests and coverage
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
