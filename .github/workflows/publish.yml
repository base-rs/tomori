name: Publish to crates.io

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  # Project-specific: bake-cargo's template also checks formatting and Clippy here, and runs the tests on pushes. Test.yml's test job already does all of these, for every pull request, merge queue entry and push, and the main branch requires its test-result, so this job keeps only what publishing needs. A push to main is the commit that the merge queue tested.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bake launcher
        run: cargo install bake --locked
      - name: Detect an explicit release request
        id: detect
        env:
          BAKE_BEFORE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          BAKE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: cargo bake --locked cargo:release:detect --base "$BAKE_BEFORE" --sha "$BAKE_SHA"
      # Project-specific: packaging builds the desktop client and the speech crate, which need ALSA and the sherpa-onnx libraries.
      - name: Install the ALSA development files for the desktop client
        if: steps.detect.outputs.release == 'true'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev
      - name: Fetch the sherpa-onnx libraries
        if: steps.detect.outputs.release == 'true'
        run: bash scripts/fetch-sherpa-onnx.sh
      - name: Validate release candidate
        if: steps.detect.outputs.release == 'true'
        run: cargo bake --locked cargo:release

  publish:
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    concurrency: release-${{ github.ref }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Bake launcher
        run: cargo install bake --locked
      - name: Find workspace packages that need publishing
        id: packages
        env:
          BAKE_VERSION: ${{ needs.check.outputs.version }}
        run: cargo bake --locked cargo:publish:pending --version "$BAKE_VERSION"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.packages.outputs.has_packages == 'true'
      - name: Publish workspace and create GitHub Release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          BAKE_VERSION: ${{ needs.check.outputs.version }}
          BAKE_SHA: ${{ github.sha }}
        run: cargo bake --locked cargo:release:publish --version "$BAKE_VERSION" --sha "$BAKE_SHA"
